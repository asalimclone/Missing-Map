<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة المندوبين - TDM | Interactive Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; overflow: hidden; }
        #map { height: 100vh; width: 100%; z-index: 1; }

        .sidebar {
            position: fixed; top: 0; right: 0; width: 340px; height: 100vh;
            background: linear-gradient(180deg, #1a237e 0%, #283593 100%);
            z-index: 1000; padding: 20px; overflow-y: auto;
            box-shadow: -4px 0 20px rgba(0,0,0,0.3); transition: transform 0.3s ease;
        }
        .sidebar.collapsed { transform: translateX(100%); }

        .sidebar-header { text-align: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid rgba(255,255,255,0.2); }
        .sidebar-header h1 { color: #fff; font-size: 20px; margin-bottom: 5px; }
        .sidebar-header p { color: rgba(255,255,255,0.7); font-size: 12px; }

        .upload-section {
            background: rgba(255,255,255,0.1); border-radius: 12px; padding: 15px;
            margin-bottom: 15px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15);
        }
        .upload-section h3 { color: #64b5f6; font-size: 13px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }

        .upload-btn {
            width: 100%; padding: 12px; border: 2px dashed rgba(255,255,255,0.4);
            border-radius: 10px; background: rgba(255,255,255,0.05); color: #fff;
            cursor: pointer; text-align: center; transition: all 0.3s ease; font-size: 13px; margin-bottom: 8px;
        }
        .upload-btn:hover { background: rgba(255,255,255,0.15); border-color: #64b5f6; }
        .upload-btn i { margin-left: 8px; }

        .file-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .file-actions button { flex: 1; padding: 8px; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; transition: all 0.3s ease; }
        .btn-export { background: #43a047; color: #fff; }
        .btn-export:hover { background: #2e7d32; }
        .btn-import { background: #fb8c00; color: #fff; }
        .btn-import:hover { background: #ef6c00; }
        .btn-refresh { background: #1e88e5; color: #fff; flex: 1 1 100%; margin-top: 6px; }
        .btn-refresh:hover { background: #1565c0; }

        .file-info { color: rgba(255,255,255,0.6); font-size: 11px; text-align: center; margin-top: 8px; }

        .tdm-selector { margin-bottom: 15px; }
        .tdm-selector label { display: block; color: #fff; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
        .tdm-selector select {
            width: 100%; padding: 12px 15px; border: none; border-radius: 10px;
            background: rgba(255,255,255,0.15); color: #fff; font-size: 14px;
            cursor: pointer; outline: none; border: 1px solid rgba(255,255,255,0.2);
        }
        .tdm-selector select option { background: #1a237e; color: #fff; }
        .tdm-selector select:focus { border-color: #64b5f6; }

        .stats-box {
            background: rgba(255,255,255,0.1); border-radius: 12px; padding: 15px;
            margin-bottom: 15px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15); display: none;
        }
        .stats-box.show { display: block; }
        .stats-box h3 { color: #64b5f6; font-size: 13px; margin-bottom: 10px; }
        .stat-item { display: flex; justify-content: space-between; color: #fff; font-size: 13px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .stat-item:last-child { border-bottom: none; }

        .shops-section { display: none; }
        .shops-section.show { display: block; }
        .shops-section h3 { color: #64b5f6; font-size: 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

        .shop-card {
            background: rgba(255,255,255,0.1); border-radius: 12px; padding: 12px;
            margin-bottom: 8px; cursor: pointer; transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.1);
        }
        .shop-card:hover { background: rgba(255,255,255,0.2); transform: translateX(-3px); border-color: #64b5f6; }
        .shop-card.active { background: rgba(100, 181, 246, 0.3); border-color: #64b5f6; }
        .shop-card h4 { color: #fff; font-size: 14px; margin-bottom: 4px; }
        .shop-card p { color: rgba(255,255,255,0.7); font-size: 11px; margin-bottom: 2px; }
        .shop-card .shop-day { display: inline-block; background: #ff7043; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 10px; margin-top: 4px; }
        .shop-card .shop-code { display: inline-block; background: rgba(255,255,255,0.2); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 10px; margin-right: 5px; }

        .sidebar-toggle {
            position: fixed; top: 20px; right: 360px; z-index: 1001; background: #1a237e;
            color: #fff; border: none; width: 45px; height: 45px; border-radius: 50%;
            cursor: pointer; font-size: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease; display: flex; align-items: center; justify-content: center;
        }
        .sidebar-toggle:hover { background: #283593; transform: scale(1.1); }
        .sidebar-toggle.collapsed { right: 20px; }

        .gps-status {
            position: fixed; top: 20px; left: 20px; z-index: 1001; background: rgba(0,0,0,0.8);
            color: #fff; padding: 10px 20px; border-radius: 25px; font-size: 13px;
            display: flex; align-items: center; gap: 8px; backdrop-filter: blur(10px);
        }
        .gps-status .gps-dot { width: 10px; height: 10px; border-radius: 50%; background: #ff5252; animation: pulse 1.5s infinite; }
        .gps-status.active .gps-dot { background: #69f0ae; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } }

        .custom-popup { text-align: center; min-width: 220px; }
        .custom-popup h3 { color: #1a237e; margin-bottom: 8px; font-size: 15px; }
        .custom-popup p { color: #666; font-size: 12px; margin-bottom: 4px; }
        .day-badge { display: inline-block; background: linear-gradient(135deg, #ff7043, #f4511e); color: #fff; padding: 4px 15px; border-radius: 20px; font-size: 13px; font-weight: 600; margin: 8px 0; }
        .navigate-btn {
            background: linear-gradient(135deg, #1a237e, #3949ab); color: #fff; border: none;
            padding: 10px 25px; border-radius: 25px; cursor: pointer; font-size: 14px; font-weight: 600;
            margin-top: 8px; transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 8px;
        }
        .navigate-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(26, 35, 126, 0.4); }

        .route-info {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1001;
            background: rgba(0,0,0,0.9); color: #fff; padding: 12px 25px; border-radius: 15px;
            font-size: 13px; display: none; align-items: center; gap: 15px; backdrop-filter: blur(10px);
        }
        .route-info.show { display: flex; }
        .route-info .info-item { display: flex; align-items: center; gap: 6px; }
        .route-info .info-item i { color: #64b5f6; }
        .close-route { background: #ff5252; color: #fff; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 12px; }

        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 35, 126, 0.95); z-index: 2000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff;
        }
        .loading-overlay.hidden { display: none; }
        .loading-spinner { width: 60px; height: 60px; border: 4px solid rgba(255,255,255,0.2); border-top-color: #64b5f6; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-overlay h2 { font-size: 20px; margin-bottom: 10px; }
        .loading-overlay p { color: rgba(255,255,255,0.7); font-size: 14px; }

        .toast {
            position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 3000;
            padding: 15px 30px; border-radius: 10px; color: #fff; font-size: 14px; display: none;
            animation: slideDown 0.3s ease;
        }
        .toast.show { display: block; }
        .toast.success { background: #43a047; }
        .toast.error { background: #e53935; }
        .toast.info { background: #1e88e5; }
        @keyframes slideDown { from { transform: translateX(-50%) translateY(-20px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }

        @media (max-width: 768px) { .sidebar { width: 300px; } .sidebar-toggle { right: 320px; } .sidebar-toggle.collapsed { right: 15px; } }

        .leaflet-popup-content-wrapper { border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .leaflet-popup-content { margin: 15px; }
        .leaflet-routing-container { display: none !important; }
        #excelInput, #jsonInput { display: none; }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <h2>جاري تحميل البيانات...</h2>
        <p>يتم الاتصال بالسيرفر لجلب احدث البيانات</p>
    </div>

    <div class="gps-status" id="gpsStatus">
        <div class="gps-dot"></div>
        <span id="gpsText">جاري البحث عن الموقع...</span>
    </div>

    <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </button>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1><i class="fas fa-map-marked-alt"></i> خريطة المندوبين</h1>
            <p>نظام تتبع المحلات - TDM</p>
        </div>

        <div class="upload-section">
            <h3><i class="fas fa-database"></i> مصدر البيانات</h3>
            <div class="file-info" id="fileInfo" style="margin-bottom:10px;">
                جاري التحميل...
            </div>

            <div class="upload-btn" onclick="document.getElementById('excelInput').click()">
                <i class="fas fa-cloud-upload-alt"></i>
                رفع ملف Excel (.xlsx)
            </div>
            <input type="file" id="excelInput" accept=".xlsx,.xls,.csv" onchange="handleExcelUpload(event)">

            <div class="file-actions">
                <button class="btn-export" onclick="exportData()">
                    <i class="fas fa-download"></i> تصدير JSON
                </button>
                <button class="btn-import" onclick="document.getElementById('jsonInput').click()">
                    <i class="fas fa-upload"></i> استيراد JSON
                </button>
                <input type="file" id="jsonInput" accept=".json" onchange="handleJSONImport(event)">
            </div>
            <button class="btn-refresh" onclick="refreshDataFromServer()">
                <i class="fas fa-sync-alt"></i> تحديث البيانات من السيرفر
            </button>
        </div>

        <div class="tdm-selector">
            <label><i class="fas fa-user-tie"></i> اختر المندوب (TDM)</label>
            <select id="tdmSelect" onchange="selectTDM(this.value)">
                <option value="">-- اختر المندوب --</option>
            </select>
        </div>

        <div class="stats-box" id="statsBox">
            <h3><i class="fas fa-chart-bar"></i> إحصائيات المندوب</h3>
            <div class="stat-item"><span>عدد المحلات:</span><span id="shopCount">0</span></div>
            <div class="stat-item"><span>المنطقة:</span><span id="tdmArea">-</span></div>
        </div>

        <div class="shops-section" id="shopsSection">
            <h3><i class="fas fa-store"></i> محلات المندوب</h3>
            <div id="shopsList"></div>
        </div>
    </div>

    <div class="route-info" id="routeInfo">
        <button class="close-route" onclick="clearRoute()"><i class="fas fa-times"></i></button>
        <div class="info-item"><i class="fas fa-road"></i><span id="routeDistance">-</span></div>
        <div class="info-item"><i class="fas fa-clock"></i><span id="routeTime">-</span></div>
        <div class="info-item"><i class="fas fa-flag-checkered"></i><span id="routeDestination">-</span></div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        // ===================== GLOBAL VARIABLES =====================
        let map;
        let userMarker = null;
        let userCircle = null;
        let shopMarkers = [];
        let currentRoutingControl = null;
        let currentTDM = null;
        let userPosition = null;
        let watchId = null;
        let tdmData = {};  // البيانات هتتحمل من data.json أو localStorage

        // ===================== INIT =====================
        document.addEventListener('DOMContentLoaded', function() {
            initMap();
            loadData();   // تحميل البيانات من السيرفر أولاً
            requestGPS();
        });

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([30.0444, 31.2357], 12);
            L.control.zoom({ position: 'bottomleft' }).addTo(map);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            L.control.scale({ position: 'bottomleft', metric: true, imperial: false }).addTo(map);
        }

        // ===================== DATA LOADING =====================
        async function loadData() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.classList.remove('hidden');

            // 1. حاول تجيب البيانات من ملف data.json على السيرفر
            try {
                const response = await fetch('./data.json?v=' + Date.now());
                if (response.ok) {
                    const data = await response.json();
                    if (data && typeof data === 'object' && Object.keys(data).length > 0) {
                        tdmData = data;
                        saveToLocalStorage(data);
                        updateFileInfo();
                        populateTDMSelect();
                        loadingOverlay.classList.add('hidden');
                        showToast('✅ تم تحميل البيانات من السيرفر بنجاح!', 'success');
                        return;
                    }
                }
            } catch(e) {
                console.log('لم يتم العثور على data.json على السيرفر:', e);
            }

            // 2. لو مفيش سيرفر، جرب localStorage
            const local = localStorage.getItem('tdm_map_data');
            if (local) {
                try {
                    tdmData = JSON.parse(local);
                    updateFileInfo();
                    populateTDMSelect();
                    loadingOverlay.classList.add('hidden');
                    showToast('⚠️ لم يتم العثور على السيرفر. تم تحميل البيانات المحلية.', 'info');
                    return;
                } catch(e) {
                    console.error('خطأ في قراءة localStorage:', e);
                }
            }

            // 3. مفيش بيانات خالص
            tdmData = {};
            updateFileInfo();
            populateTDMSelect();
            loadingOverlay.classList.add('hidden');
            showToast('ℹ️ لا توجد بيانات. ارفع ملف Excel أو JSON.', 'info');
        }

        async function refreshDataFromServer() {
            showToast('جاري التحديث...', 'info');
            await loadData();
            if (currentTDM) {
                selectTDM(currentTDM);
            }
        }

        function saveToLocalStorage(data) {
            try {
                localStorage.setItem('tdm_map_data', JSON.stringify(data));
            } catch(e) {
                showToast('⚠️ لا يمكن الحفظ محلياً: الذاكرة ممتلئة', 'error');
            }
        }

        function updateFileInfo() {
            const totalTDMs = Object.keys(tdmData).length;
            const totalShops = Object.values(tdmData).reduce((sum, t) => sum + (t.shops ? t.shops.length : 0), 0);
            document.getElementById('fileInfo').innerHTML =
                `✓ ${totalTDMs} مندوب | ${totalShops} محل`;
        }

        function populateTDMSelect() {
            const select = document.getElementById('tdmSelect');
            select.innerHTML = '<option value="">-- اختر المندوب --</option>';
            for (const [code, data] of Object.entries(tdmData)) {
                const option = document.createElement('option');
                option.value = code;
                option.textContent = `${code} - ${data.name || code} (${data.area || 'غير محدد'})`;
                select.appendChild(option);
            }
        }

        // ===================== TOAST =====================
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }

        // ===================== EXCEL UPLOAD =====================
        function handleExcelUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            showToast('جاري قراءة ملف Excel...', 'info');

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet);

                    if (jsonData.length === 0) {
                        showToast('الملف فارغ!', 'error');
                        return;
                    }

                    const newData = {};
                    const colors = ["#e53935", "#1e88e5", "#43a047", "#fb8c00", "#8e24aa", "#00acc1",
                                    "#d81b60", "#5e35b1", "#ff5722", "#795548", "#009688", "#3f51b5"];
                    let colorIndex = 0;

                    jsonData.forEach((row, idx) => {
                        const tdmCode = String(getCellValue(row, ['TDM_Code', 'TDM Code', 'كود المندوب']) || '').trim();
                        const tdmName = String(getCellValue(row, ['TDM_Name', 'TDM Name', 'اسم المندوب']) || '').trim();
                        const area = String(getCellValue(row, ['Area', 'المنطقة']) || '').trim();
                        const shopId = String(getCellValue(row, ['Shop_ID', 'Shop ID', 'كود المحل']) || '').trim();
                        const shopName = String(getCellValue(row, ['Shop_Name', 'Shop Name', 'اسم المحل']) || '').trim();
                        const address = String(getCellValue(row, ['Address', 'العنوان']) || '').trim();
                        const lat = parseFloat(getCellValue(row, ['Lat', 'lat', 'خط العرض']));
                        const lng = parseFloat(getCellValue(row, ['Lng', 'lng', 'Lon', 'lon', 'خط الطول']));
                        const day = String(getCellValue(row, ['Day', 'day', 'اليوم']) || '').trim();

                        if (tdmCode.toLowerCase() === 'tdm_code' || !tdmCode || !shopName || isNaN(lat) || isNaN(lng)) {
                            return;
                        }

                        if (!newData[tdmCode]) {
                            newData[tdmCode] = {
                                name: tdmName || tdmCode,
                                area: area || 'غير محدد',
                                color: colors[colorIndex % colors.length],
                                shops: []
                            };
                            colorIndex++;
                        }

                        newData[tdmCode].shops.push({
                            id: shopId || `${tdmCode}-${idx}`,
                            name: shopName, lat: lat, lng: lng,
                            address: address || area || '', day: day
                        });
                    });

                    if (Object.keys(newData).length === 0) {
                        showToast('لم يتم العثور على بيانات صالحة!', 'error');
                        return;
                    }

                    // دمج مع البيانات الحالية
                    Object.assign(tdmData, newData);
                    saveToLocalStorage(tdmData);
                    clearShopMarkers();
                    clearRoute();
                    populateTDMSelect();
                    document.getElementById('tdmSelect').value = '';
                    document.getElementById('statsBox').classList.remove('show');
                    document.getElementById('shopsSection').classList.remove('show');
                    updateFileInfo();

                    showToast(`✅ تم إضافة ${Object.keys(newData).length} مندوب جديد!`, 'success');

                } catch (err) {
                    console.error(err);
                    showToast('خطأ في قراءة الملف: ' + err.message, 'error');
                }
            };
            reader.readAsArrayBuffer(file);
            event.target.value = '';
        }

        function getCellValue(row, possibleKeys) {
            for (const key of possibleKeys) {
                if (row[key] !== undefined && row[key] !== null && row[key] !== '') return row[key];
            }
            return undefined;
        }

        // ===================== EXPORT / IMPORT JSON =====================
        function exportData() {
            if (!tdmData || Object.keys(tdmData).length === 0) {
                showToast('لا توجد بيانات للتصدير!', 'error');
                return;
            }
            const dataStr = JSON.stringify(tdmData, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'tdm_data.json';
            document.body.appendChild(a); a.click();
            document.body.removeChild(a); URL.revokeObjectURL(url);
            showToast('✅ تم تصدير البيانات!', 'success');
        }

        function handleJSONImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (typeof imported === 'object' && Object.keys(imported).length > 0) {
                        tdmData = imported;
                        saveToLocalStorage(tdmData);
                        clearShopMarkers(); clearRoute();
                        populateTDMSelect();
                        document.getElementById('tdmSelect').value = '';
                        document.getElementById('statsBox').classList.remove('show');
                        document.getElementById('shopsSection').classList.remove('show');
                        updateFileInfo();
                        showToast('✅ تم استيراد البيانات بنجاح!', 'success');
                    } else {
                        showToast('ملف JSON فارغ!', 'error');
                    }
                } catch (err) {
                    showToast('❌ خطأ في قراءة JSON!', 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ===================== GPS =====================
        function requestGPS() {
            const gpsStatus = document.getElementById('gpsStatus');
            const gpsText = document.getElementById('gpsText');

            if (!navigator.geolocation) {
                gpsText.textContent = "المتصفح لا يدعم GPS";
                showToast('متصفحك لا يدعم GPS', 'error');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    handlePositionUpdate(position);
                    gpsStatus.classList.add('active');
                    gpsText.textContent = "تم تحديد الموقع ✓";
                    watchId = navigator.geolocation.watchPosition(
                        handlePositionUpdate, handlePositionError,
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                    );
                },
                function(error) {
                    handlePositionError(error);
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        function handlePositionUpdate(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;
            userPosition = [lat, lng];

            const userIcon = L.divIcon({
                className: 'user-location-icon',
                html: `<div style="background: #1a237e; width: 20px; height: 20px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 4px rgba(26,35,126,0.3), 0 4px 15px rgba(0,0,0,0.3); animation: pulse 1.5s infinite;"></div>`,
                iconSize: [20, 20], iconAnchor: [10, 10]
            });

            if (userMarker) {
                userMarker.setLatLng([lat, lng]);
            } else {
                userMarker = L.marker([lat, lng], { icon: userIcon, zIndexOffset: 1000 }).addTo(map);
                map.setView([lat, lng], 15);
            }

            if (userCircle) {
                userCircle.setLatLng([lat, lng]);
                userCircle.setRadius(accuracy);
            } else {
                userCircle = L.circle([lat, lng], {
                    radius: accuracy, color: '#1a237e', fillColor: '#1a237e',
                    fillOpacity: 0.1, weight: 1
                }).addTo(map);
            }

            document.getElementById('gpsText').textContent = `موقعك الحالي (${accuracy.toFixed(0)}م دقة)`;
        }

        function handlePositionError(error) {
            const gpsText = document.getElementById('gpsText');
            let message = "خطأ في تحديد الموقع";
            switch(error.code) {
                case error.PERMISSION_DENIED: message = "تم رفض الوصول للموقع"; break;
                case error.POSITION_UNAVAILABLE: message = "الموقع غير متوفر"; break;
                case error.TIMEOUT: message = "انتهى الوقت"; break;
            }
            gpsText.textContent = message;
        }

        // ===================== TDM SELECTION =====================
        function selectTDM(tdmCode) {
            clearShopMarkers();
            clearRoute();

            if (!tdmCode) {
                document.getElementById('statsBox').classList.remove('show');
                document.getElementById('shopsSection').classList.remove('show');
                currentTDM = null;
                return;
            }

            currentTDM = tdmCode;
            const tdm = tdmData[tdmCode];
            if (!tdm) return;

            document.getElementById('shopCount').textContent = tdm.shops ? tdm.shops.length : 0;
            document.getElementById('tdmArea').textContent = tdm.area || '-';
            document.getElementById('statsBox').classList.add('show');

            renderShopsList(tdm);
            document.getElementById('shopsSection').classList.add('show');

            if (tdm.shops && tdm.shops.length > 0) {
                addShopMarkers(tdm);
                const bounds = L.latLngBounds(tdm.shops.map(s => [s.lat, s.lng]));
                if (userPosition) bounds.extend(userPosition);
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        }

        function renderShopsList(tdm) {
            const container = document.getElementById('shopsList');
            container.innerHTML = '';
            if (!tdm.shops) return;

            tdm.shops.forEach((shop) => {
                const card = document.createElement('div');
                card.className = 'shop-card';
                card.id = `shop-card-${shop.id}`;
                card.innerHTML = `
                    <h4><i class="fas fa-store" style="color: ${tdm.color || '#64b5f6'}; margin-left: 8px;"></i>${shop.name}</h4>
                    <p><i class="fas fa-map-marker-alt" style="margin-left: 5px;"></i>${shop.address || tdm.area || ''}</p>
                    <div>
                        <span class="shop-code">${shop.id}</span>
                        ${shop.day ? `<span class="shop-day"><i class="fas fa-calendar-day" style="margin-left:3px;"></i>${shop.day}</span>` : ''}
                    </div>
                `;
                card.onclick = () => focusOnShop(shop);
                container.appendChild(card);
            });
        }

        function addShopMarkers(tdm) {
            if (!tdm.shops) return;
            const shopIcon = L.divIcon({
                className: 'shop-marker',
                html: `<div style="background: ${tdm.color || '#e53935'}; width: 32px; height: 32px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 3px solid #fff; box-shadow: 0 3px 10px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center;"><i class="fas fa-store" style="color: #fff; font-size: 12px; transform: rotate(45deg);"></i></div>`,
                iconSize: [32, 32], iconAnchor: [16, 32], popupAnchor: [0, -32]
            });

            tdm.shops.forEach(shop => {
                const marker = L.marker([shop.lat, shop.lng], { icon: shopIcon }).addTo(map);
                const dayHtml = shop.day ? `<div class="day-badge"><i class="fas fa-calendar-day"></i> ${shop.day}</div>` : '';

                const popupContent = `
                    <div class="custom-popup">
                        <h3><i class="fas fa-store" style="color: ${tdm.color || '#1a237e'};"></i> ${shop.name}</h3>
                        <p><i class="fas fa-map-marker-alt"></i> ${shop.address || tdm.area || ''}</p>
                        <p><i class="fas fa-barcode"></i> كود: ${shop.id}</p>
                        <p><i class="fas fa-user-tie"></i> المندوب: ${tdm.name || currentTDM}</p>
                        ${dayHtml}<br>
                        <button class="navigate-btn" onclick="navigateToShop('${shop.id}')">
                            <i class="fas fa-location-arrow"></i> روح للمحل
                        </button>
                    </div>
                `;

                marker.bindPopup(popupContent, { maxWidth: 300 });
                shopMarkers.push({ marker, shop });
            });
        }

        function clearShopMarkers() {
            shopMarkers.forEach(({ marker }) => map.removeLayer(marker));
            shopMarkers = [];
        }

        function focusOnShop(shop) {
            document.querySelectorAll('.shop-card').forEach(c => c.classList.remove('active'));
            const card = document.getElementById(`shop-card-${shop.id}`);
            if (card) card.classList.add('active');

            const shopMarker = shopMarkers.find(sm => sm.shop.id === shop.id);
            if (shopMarker) {
                map.setView([shop.lat, shop.lng], 17);
                shopMarker.marker.openPopup();
            }
        }

        // ===================== NAVIGATION =====================
        function navigateToShop(shopId) {
            if (!userPosition) {
                showToast('لم يتم تحديد موقعك! يرجى تفعيل GPS', 'error');
                return;
            }

            const shop = findShopById(shopId);
            if (!shop) return;

            clearRoute();

            currentRoutingControl = L.Routing.control({
                waypoints: [
                    L.latLng(userPosition[0], userPosition[1]),
                    L.latLng(shop.lat, shop.lng)
                ],
                routeWhileDragging: false,
                addWaypoints: false,
                draggableWaypoints: false,
                fitSelectedRoutes: true,
                showAlternatives: false,
                lineOptions: {
                    styles: [
                        { color: '#1a237e', opacity: 0.8, weight: 6 },
                        { color: '#64b5f6', opacity: 1, weight: 3 }
                    ]
                },
                createMarker: function() { return null; },
                router: L.Routing.osrmv1({ serviceUrl: 'https://router.project-osrm.org/route/v1' })
            }).addTo(map);

            currentRoutingControl.on('routesfound', function(e) {
                const route = e.routes[0];
                const distance = (route.summary.totalDistance / 1000).toFixed(1);
                const time = Math.round(route.summary.totalTime / 60);

                document.getElementById('routeDistance').textContent = `${distance} كم`;
                document.getElementById('routeTime').textContent = `${time} دقيقة`;
                document.getElementById('routeDestination').textContent = shop.name;
                document.getElementById('routeInfo').classList.add('show');
            });

            currentRoutingControl.on('routingerror', function(e) {
                showToast('حدث خطأ في حساب المسار. تحقق من الاتصال.', 'error');
            });
        }

        function clearRoute() {
            if (currentRoutingControl) {
                map.removeControl(currentRoutingControl);
                currentRoutingControl = null;
            }
            document.getElementById('routeInfo').classList.remove('show');
        }

        function findShopById(shopId) {
            for (const tdm of Object.values(tdmData)) {
                if (!tdm.shops) continue;
                const shop = tdm.shops.find(s => s.id === shopId);
                if (shop) return shop;
            }
            return null;
        }

        // ===================== UI =====================
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggle = document.getElementById('sidebarToggle');
            sidebar.classList.toggle('collapsed');
            toggle.classList.toggle('collapsed');
        }

        window.addEventListener('resize', function() { map.invalidateSize(); });
    </script>
</body>
</html>
